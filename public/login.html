<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - CocoYeah Stock Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
            pageLanguage: 'th', // ภาษาหลักของเว็บไซต์คุณ
            includedLanguages: 'zh-CN,en', // กำหนดให้เลือกแปลเป็น จีน (zh-CN) และ อังกฤษ (en) ได้
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full border border-slate-200">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 text-green-600 rounded-full mb-3 shadow-inner">
                <img src="โลโก้.png" alt="Logo" class="w-10 h-10 object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/40?text=Coco';">
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Stock Management</h1>
            <p class="text-slate-500 text-sm mt-1">กรุณาเข้าสู่ระบบเพื่อจัดการสต็อกวัตถุดิบ</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="username" required placeholder="กรอกชื่อผู้ใช้" 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">รหัสผ่าน (Password)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required placeholder="กรอกรหัสผ่าน" 
                           class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white transition">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                        <i id="togglePasswordIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Message Container -->
            <div id="errorMessage" class="hidden p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-xl text-center font-medium"></div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl transition text-sm shadow-md flex items-center justify-center gap-2">
                <span id="btnText">เข้าสู่ระบบ</span>
                <i id="btnSpinner" class="fa-solid fa-spinner fa-spin hidden"></i>
            </button>
        </form>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePasswordIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            errorDiv.classList.add('hidden');
            errorDiv.classList.remove('shake');

            submitBtn.disabled = true;
            btnText.innerText = 'กำลังเข้าสู่ระบบ...';
            btnSpinner.classList.remove('hidden');

            try {
                // กำหนด API Target URL รองรับทั้งแบบ Relative Path และ External Origin
                let targetUrl = '/api/login';
                
                if (window.location.protocol === 'file:') {
                    targetUrl = 'http://localhost:5001/api/login';
                }

                const res = await fetch(targetUrl, {    
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                }

                localStorage.setItem('user_info', JSON.stringify(data.user));
                window.location.href = 'index.html';

            } catch (err) {
                console.error('Login Error:', err);
                errorDiv.innerText = err.message || 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้';
                errorDiv.classList.remove('hidden');
                setTimeout(() => errorDiv.classList.add('shake'), 10);
            } finally {
                submitBtn.disabled = false;
                btnText.innerText = 'เข้าสู่ระบบ';
                btnSpinner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
